name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, intl, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest

  servers:
    name: ${{ matrix.name }} (PHP 8.4 / Laravel 13)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4
            driver: mysql
            port: 3306
            health: mysqladmin ping -uroot -psecret
          - name: MariaDB 11.4
            image: mariadb:11.4
            driver: mysql
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
          - name: PostgreSQL 17
            image: postgres:17
            driver: pgsql
            port: 5432
            health: pg_isready -U postgres

    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
          POSTGRES_PASSWORD: secret
          MYSQL_DATABASE: tenancy_central
          MARIADB_DATABASE: tenancy_central
          POSTGRES_DB: tenancy_central
        ports: ['${{ matrix.port }}:${{ matrix.port }}']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      TENANCY_TEST_MYSQL: ${{ matrix.driver == 'mysql' && '1' || '' }}
      TENANCY_TEST_MYSQL_PASSWORD: secret
      TENANCY_TEST_PGSQL: ${{ matrix.driver == 'pgsql' && '1' || '' }}
      TENANCY_TEST_PGSQL_PASSWORD: secret
      TENANCY_TEST_CENTRAL: ${{ matrix.driver }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring, intl, zip
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest

  quality:
    name: Static analysis and style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: composer audit
